name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpspec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Validate Composer configuration
        # Existing library dependencies intentionally use wildcard constraints.
        run: composer validate --strict --no-check-all
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPSpec
        run: composer test
